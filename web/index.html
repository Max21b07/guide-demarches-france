<style>
  :root{
    --blue-deep:#1a388c; --blue-light:#438fff; --green:#33bd73; --red:#eb4d54;
    --orange:#fba029; --yellow:#fdcc38;
    --bg:#f4f5f8; --card:#ffffff; --text:#14161c; --muted:#6b7280; --line:#e6e8ee;
    --radius:18px; --shadow:0 6px 18px rgba(20,30,60,.08);
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --card:#1a1d24; --text:#f2f3f5; --muted:#9aa0ad; --line:#2a2e38;
      --shadow:0 6px 18px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --card:#1a1d24; --text:#f2f3f5; --muted:#9aa0ad; --line:#2a2e38;
    --shadow:0 6px 18px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.4;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  #app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;
    padding:calc(var(--safe-t) + 8px) 16px calc(84px + var(--safe-b)) 16px;}
  h1,h2,h3{margin:0}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .row{display:flex;align-items:center;gap:12px}
  .sp{flex:1}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center;flex:1}
  .tile .v{font-size:22px;font-weight:800}
  .tile .l{font-size:12px;color:var(--muted)}
  .grid3{display:flex;gap:10px;margin-bottom:14px}
  .btn{display:block;width:100%;border:none;border-radius:var(--radius);padding:16px;
    font-size:17px;font-weight:700;color:#fff;background:var(--blue-deep);cursor:pointer;margin:6px 0;
    transition:transform .12s,opacity .12s}
  .btn:active{transform:scale(.98);opacity:.9}
  .btn.green{background:var(--green)} .btn.orange{background:var(--orange)}
  .btn.ghost{background:transparent;color:var(--blue-deep);border:1.5px solid var(--blue-deep)}
  .btn[disabled]{opacity:.45}
  .access{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px;margin-bottom:12px;cursor:pointer}
  .access .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff;flex:none}
  .access .t{font-weight:700}
  .bar{height:10px;border-radius:99px;background:rgba(120,120,120,.18);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:var(--blue-light);transition:width .4s}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
    border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;cursor:pointer;color:var(--text);font-size:16px}
  .opt .mk{flex:none;width:22px;height:22px;border-radius:99px;border:2px solid var(--muted);margin-top:1px}
  .opt.sel{border-color:var(--blue-deep);background:rgba(67,143,255,.10)} .opt.sel .mk{border-color:var(--blue-deep);background:var(--blue-deep)}
  .opt.ok{border-color:var(--green);background:rgba(51,189,115,.12)} .opt.ok .mk{border-color:var(--green);background:var(--green)}
  .opt.ko{border-color:var(--red);background:rgba(235,77,84,.12)} .opt.ko .mk{border-color:var(--red);background:var(--red)}
  .opt.dim{opacity:.55}
  .opt .tr{display:block;color:var(--muted);font-size:14px;margin-top:3px}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
  .link{color:var(--blue-light);font-weight:600;cursor:pointer}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);
    display:flex;max-width:480px;margin:0 auto;padding:8px 0 calc(6px + var(--safe-b))}
  .tabbar button{flex:1;background:none;border:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .tabbar button .em{font-size:21px}
  .tabbar button.on{color:var(--blue-deep)}
  @media (prefers-color-scheme: dark){.tabbar button.on{color:var(--blue-light)}}
  .topbar{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
  .mono{font-variant-numeric:tabular-nums}
  .ring{width:170px;height:170px;margin:0 auto;display:block}
  .toast{position:fixed;top:calc(var(--safe-t) + 10px);left:0;right:0;z-index:99;display:flex;justify-content:center;pointer-events:none}
  .toast .in{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center;
    transform:translateY(-120px);transition:transform .35s;max-width:90%}
  .toast.show .in{transform:translateY(0)}
  .seg{display:flex;background:rgba(120,120,120,.15);border-radius:12px;padding:3px;margin:8px 0}
  .seg button{flex:1;border:none;background:none;padding:8px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
  .switch{position:relative;width:50px;height:30px;flex:none}
  .switch input{display:none}
  .switch label{position:absolute;inset:0;background:rgba(120,120,120,.3);border-radius:99px;transition:.2s;cursor:pointer}
  .switch label:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:99px;transition:.2s}
  .switch input:checked+label{background:var(--green)} .switch input:checked+label:after{left:23px}
  .catbars i{display:block}
  .fade{animation:fade .25s}
  @media (prefers-reduced-motion: reduce){ .fade{animation:none} *{transition:none!important} }
  .opt:focus-visible,.access:focus-visible,.btn:focus-visible,.tabbar button:focus-visible,.cell:focus-visible,.link:focus-visible{outline:3px solid var(--blue-light);outline-offset:2px}
  .gridwrap{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .cell{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-weight:700;cursor:pointer;display:grid;place-items:center;font-size:15px}
  .cell.done{background:var(--blue-deep);color:#fff;border-color:var(--blue-deep)}
  .cell.flag{box-shadow:inset 0 0 0 3px var(--orange)}
  .cell.cur{outline:3px solid var(--blue-light);outline-offset:1px}
  :root[data-contrast="high"]{ --muted:#1a1a1a; --line:#555; --text:#000; }
  @media (prefers-color-scheme: dark){ :root[data-contrast="high"]:not([data-theme="light"]){ --muted:#f2f2f2; --line:#bbb; --text:#fff; } }
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
  .shake{animation:shake .5s}
  @keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .3s ease-out}
  @keyframes xpfloat{0%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(-50%,-140px);opacity:0}}
  .xpfloat{position:fixed;left:50%;top:48%;font-weight:800;color:var(--green);font-size:30px;z-index:120;pointer-events:none;animation:xpfloat 1.05s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.15)}
  .confetti-piece{position:fixed;top:-12px;width:10px;height:14px;z-index:130;pointer-events:none;border-radius:2px;will-change:transform,opacity}
  @keyframes conffall{to{transform:translateY(112vh) rotate(760deg);opacity:0}}
  @media (prefers-reduced-motion: reduce){ .shake,.pop,.xpfloat,.confetti-piece{animation:none!important} .confetti-piece{display:none} }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .big{font-size:26px;font-weight:800}
  select,input[type=time]{font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
</style>
</head>
<body>
<div id="app" translate="no" class="notranslate"></div>
<div class="toast" id="toast"><div class="in"><span id="toastIc" class="em">🏅</span><div><div class="muted" style="font-size:12px" id="toastSub">Badge débloqué</div><b id="toastTxt"></b></div></div></div>
<script src="questions.js"></script>
<script>
"use strict";
/* ============================= Données & état ============================= */
const CFG = { q:40, mins:45, pass:80, threshold:32 };
const KEY = 'civicfr', EKEY = 'civicfr_exam';

// Mélange des réponses, déterministe par identifiant de question :
// la bonne réponse n'est plus toujours en 1re position, mais l'ordre reste
// stable d'un chargement à l'autre (reprise d'examen cohérente).
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function shuffleAnswers(q){
  const rng=mulberry32(hashStr(q.id));
  const order=[0,1,2,3];
  for(let i=order.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  return Object.assign({},q,{
    answers_fr: order.map(i=>q.answers_fr[i]),
    answers_vi: order.map(i=>(q.answers_vi||q.answers_fr)[i]),
    correct_answer: order.indexOf(q.correct_answer)
  });
}
const QUESTIONS = (window.QUESTIONS||[])
  .filter(q=>q.answers_fr&&q.answers_fr.length===4&&q.correct_answer>=0&&q.correct_answer<4)
  .map(shuffleAnswers);

const CATS = {
  valeurs:{fr:"Valeurs de la République",vi:"Giá trị của nền Cộng hòa",em:"🏛️",c:"#1a388c"},
  institutions:{fr:"Institutions",vi:"Thể chế",em:"⚖️",c:"#438fff"},
  droits:{fr:"Droits et devoirs",vi:"Quyền và nghĩa vụ",em:"✅",c:"#33bd73"},
  histoire:{fr:"Histoire de France",vi:"Lịch sử nước Pháp",em:"🕰️",c:"#a9703e"},
  geographie:{fr:"Géographie",vi:"Địa lý",em:"🗺️",c:"#1aa5a5"},
  vieQuotidienne:{fr:"Vie quotidienne",vi:"Đời sống hằng ngày",em:"🏠",c:"#fba029"},
  education:{fr:"Éducation",vi:"Giáo dục",em:"🎓",c:"#6a5acd"},
  sante:{fr:"Santé",vi:"Y tế",em:"➕",c:"#e86aa0"},
  travail:{fr:"Travail",vi:"Việc làm",em:"💼",c:"#8b5cf6"},
  famille:{fr:"Famille et démarches",vi:"Gia đình, thủ tục",em:"👨‍👩‍👧",c:"#19b6d6"},
};
const LEVELS=[
  {n:{fr:"Débutante",vi:"Người mới"},xp:0},{n:{fr:"Apprentie",vi:"Học viên"},xp:200},
  {n:{fr:"Exploratrice",vi:"Khám phá"},xp:500},{n:{fr:"Confirmée",vi:"Vững vàng"},xp:1000},
  {n:{fr:"Experte",vi:"Chuyên gia"},xp:2000},{n:{fr:"Prête pour l'examen",vi:"Sẵn sàng thi"},xp:3500},
];
const BADGES=[
  {id:"first",fr:"Première question",vi:"Câu đầu tiên",em:"⭐",ok:d=>d.totalAnswered>=1},
  {id:"c50",fr:"50 réussies",vi:"50 câu đúng",em:"5️⃣",ok:d=>d.totalCorrect>=50},
  {id:"c100",fr:"100 réussies",vi:"100 câu đúng",em:"💯",ok:d=>d.totalCorrect>=100},
  {id:"exam1",fr:"Première simulation",vi:"Thi thử đầu tiên",em:"🏁",ok:d=>d.exams.length>=1},
  {id:"pass1",fr:"Examen réussi",vi:"Đỗ kỳ thi",em:"🎖️",ok:d=>d.exams.some(e=>e.pct>=CFG.pass)},
  {id:"s7",fr:"7 jours",vi:"7 ngày",em:"🔥",ok:d=>d.longestStreak>=7},
  {id:"s30",fr:"30 jours",vi:"30 ngày",em:"🌟",ok:d=>d.longestStreak>=30},
  {id:"r90",fr:"90 % sur une simulation",vi:"90% một bài thi",em:"📈",ok:d=>d.exams.some(e=>e.pct>=90)},
];
const T={
  home:{fr:"Accueil",vi:"Trang chủ"},learn:{fr:"Apprendre",vi:"Học"},exam:{fr:"Examen",vi:"Thi thử"},profile:{fr:"Profil",vi:"Hồ sơ"},
  start:{fr:"COMMENCER UN TEST",vi:"BẮT ĐẦU LÀM BÀI"},goal:{fr:"réussir l'examen civique français",vi:"đỗ kỳ thi công dân Pháp"},
  mastered:{fr:"Maîtrisées",vi:"Thành thạo"},review:{fr:"À revoir",vi:"Cần ôn"},last:{fr:"Dernier",vi:"Gần nhất"},best:{fr:"Record",vi:"Cao nhất"},
  daily:{fr:"Entraînement quotidien",vi:"Luyện tập hằng ngày"},rev:{fr:"Révision des erreurs",vi:"Ôn lại lỗi sai"},
  stats:{fr:"Mes statistiques",vi:"Thống kê"},badges:{fr:"Mes badges",vi:"Huy hiệu"},prog:{fr:"Programme 30 jours",vi:"Lộ trình 30 ngày"},
  translate:{fr:"🇻🇳 Traduire",vi:"🇫🇷 Dịch"},hide:{fr:"Masquer la traduction",vi:"Ẩn bản dịch"},
  validate:{fr:"Valider",vi:"Xác nhận"},next:{fr:"Suivant",vi:"Tiếp"},prev:{fr:"Précédent",vi:"Trước"},finish:{fr:"Terminer",vi:"Kết thúc"},
  startExam:{fr:"COMMENCER L'EXAMEN",vi:"BẮT ĐẦU THI"},resume:{fr:"Reprendre la simulation",vi:"Tiếp tục bài thi"},
  passed:{fr:"BRAVO ! EXAMEN RÉUSSI",vi:"CHÚC MỪNG! ĐẠT YÊU CẦU"},failed:{fr:"PAS ENCORE ! CONTINUE",vi:"CHƯA ĐẠT! TIẾP TỤC CỐ GẮNG"},
  correction:{fr:"Correction détaillée",vi:"Chữa bài"},time:{fr:"Temps",vi:"Thời gian"},good:{fr:"Bonnes",vi:"Đúng"},bad:{fr:"Mauvaises",vi:"Sai"},
  settings:{fr:"Paramètres",vi:"Cài đặt"},sound:{fr:"Sons",vi:"Âm thanh"},strict:{fr:"Mode examen strict",vi:"Thi nghiêm ngặt"},lang:{fr:"Langue de l'interface",vi:"Ngôn ngữ"},
  correct:{fr:"Bonne réponse !",vi:"Chính xác!"},wrong:{fr:"Pas tout à fait",vi:"Chưa đúng"},explain:{fr:"Explication",vi:"Giải thích"},
  nodata:{fr:"Pas encore de données",vi:"Chưa có dữ liệu"},byCat:{fr:"Par catégorie",vi:"Theo chủ đề"},weak:{fr:"À retravailler en priorité",vi:"Cần cải thiện"},
  reset:{fr:"Réinitialiser ma progression",vi:"Đặt lại tiến trình"},welcome:{fr:"Bonjour 👋",vi:"Xin chào 👋"},level:{fr:"Niveau",vi:"Cấp độ"},days:{fr:"jours",vi:"ngày"}
};
// Fiches de révision (résumés fondés sur le Livret du citoyen)
const FICHES=[
  {em:"🏛️",fr:"Valeurs et principes de la République",vi:"Giá trị và nguyên tắc của nền Cộng hòa",points:[
    "Devise : Liberté, Égalité, Fraternité.",
    "République indivisible, laïque, démocratique et sociale.",
    "Laïcité (loi de 1905) : liberté de conscience, neutralité de l'État, séparation des religions et de l'État.",
    "Symboles : drapeau bleu-blanc-rouge, La Marseillaise, 14 juillet, Marianne, le coq.",
    "Égalité femmes-hommes, non-discrimination ; libertés d'expression, de la presse, de réunion et d'association."]},
  {em:"⚖️",fr:"Les institutions françaises et européennes",vi:"Thể chế Pháp và châu Âu",points:[
    "Président : élu pour 5 ans au suffrage universel direct ; chef de l'État et des armées ; nomme le Premier ministre.",
    "Gouvernement dirigé par le Premier ministre (hôtel de Matignon).",
    "Parlement = Assemblée nationale (577 députés, 5 ans) + Sénat (≈348 sénateurs, 6 ans) ; vote les lois et le budget.",
    "Commune : maire élu par le conseil municipal (6 ans), officier d'état civil.",
    "Union européenne : 27 États membres, monnaie l'euro, Parlement européen (Strasbourg)."]},
  {em:"✅",fr:"Droits et devoirs",vi:"Quyền và nghĩa vụ",points:[
    "Majorité à 18 ans ; droit de vote pour les citoyens français inscrits.",
    "Droits : liberté, égalité, protection de la santé, éducation, justice, vie privée.",
    "Devoirs : respecter les lois, payer ses impôts, respecter autrui et la laïcité.",
    "Vers 16-17 ans : recensement puis Journée défense et citoyenneté (JDC).",
    "Urgences : 15 (SAMU), 17 (police), 18 (pompiers), 112 (Europe), 119 (enfance), 3919 (violences femmes)."]},
  {em:"🕰️",fr:"Histoire, géographie et culture",vi:"Lịch sử, địa lý và văn hóa",points:[
    "Dates clés : 1789 (Révolution, DDHC), 1792 (Ire République), 1905 (laïcité), 1944 (vote des femmes), 1958 (Ve République), 1981 (abolition de la peine de mort).",
    "Forme du territoire : l'Hexagone. Fleuves : Loire, Seine, Rhône, Garonne.",
    "Montagnes : Alpes (mont Blanc), Pyrénées. Mers : Méditerranée, Atlantique, Manche.",
    "13 régions, 101 départements ; outre-mer : Guadeloupe, Martinique, Guyane, Réunion, Mayotte.",
    "Capitale : Paris. Grandes villes : Marseille, Lyon."]},
  {em:"🏠",fr:"La vie en société",vi:"Đời sống trong xã hội",points:[
    "École obligatoire de 3 à 16 ans, gratuite et laïque ; inscription en mairie.",
    "Santé : Sécurité sociale, carte Vitale, médecin traitant, CPAM.",
    "Travail : SMIC, 35 heures, CDI/CDD, 5 semaines de congés payés, France Travail.",
    "Famille : mariage ou PACS en mairie, acte de naissance ; titre de séjour en préfecture ; naturalisation.",
    "Au quotidien : tri des déchets, assurance habitation, impôts, respect du voisinage et de l'environnement."]}
];

function tr(k){return (T[k]||{})[D.lang]||(T[k]||{}).fr||k}
function catName(c){return CATS[c] ? CATS[c][D.lang]||CATS[c].fr : c}

/* ----- persistance ----- */
function defaults(){return{lang:"fr",sound:true,strict:false,onboarded:false,
  name:"",fontScale:1,highContrast:false,autoSpeakErr:false,showTrad:false,reminderOn:false,reminderHour:19,lastNudge:null,examDate:null,
  dailyGoal:20,todayXP:0,todayDate:null,goalCelebrated:null,freezes:2,usedFreeze:null,
  xp:0,streakDays:0,longestStreak:0,lastStudyDate:null,totalAnswered:0,totalCorrect:0,
  qstats:{},catstats:{},badges:[],exams:[]};}
let D=load();
function load(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return defaults()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){} idbSave(D);}
// Sauvegarde de secours dans IndexedDB (plus robuste que localStorage seul)
function idbSave(data){ try{ const r=indexedDB.open('civicfr-db',1);
  r.onupgradeneeded=()=>{ try{r.result.createObjectStore('kv')}catch(e){} };
  r.onsuccess=()=>{ try{ const tx=r.result.transaction('kv','readwrite'); tx.objectStore('kv').put(JSON.stringify(data),'D'); }catch(e){} };
 }catch(e){} }
function idbLoad(cb){ try{ const r=indexedDB.open('civicfr-db',1);
  r.onupgradeneeded=()=>{ try{r.result.createObjectStore('kv')}catch(e){} };
  r.onsuccess=()=>{ try{ const g=r.result.transaction('kv','readonly').objectStore('kv').get('D');
    g.onsuccess=()=>{ try{cb(g.result?JSON.parse(g.result):null)}catch(e){cb(null)} }; g.onerror=()=>cb(null);
  }catch(e){cb(null)} }; r.onerror=()=>cb(null);
 }catch(e){cb(null)} }

// Bandeau d'information (questions pédagogiques, non officielles)
function noticeDismissed(){try{return localStorage.getItem('civicfr_notice')==='1'}catch(e){return false}}
function dismissNotice(){try{localStorage.setItem('civicfr_notice','1')}catch(e){};render()}
function noticeCard(){ if(noticeDismissed())return '';
  return `<div class="card" style="border-left:4px solid var(--orange)"><b>ℹ️ À savoir</b>
    <p style="margin:6px 0 10px">Questions <b>pédagogiques</b> (non officielles), au format de l'examen civique 2026 :
    40 questions, 45 min, 80 % pour réussir. Référence : <b>Livret du citoyen</b> (ministère de l'Intérieur).</p>
    <button class="btn" style="padding:10px" onclick="dismissNotice()">Compris</button></div>`; }

    } else { alert('Sauvegarde téléchargée ✅'); }
  }catch(e){ alert('Sauvegarde téléchargée ✅'); } }
function importData(input){ const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const obj=JSON.parse(r.result);
      if(typeof obj!=='object'||obj===null||Array.isArray(obj)) throw new Error('fichier non reconnu');

/* ----- logique ----- */
function levelOf(xp){let l=LEVELS[0];for(const x of LEVELS)if(xp>=x.xp)l=x;return l}
function nextLevel(xp){return LEVELS.find(x=>x.xp>xp)||null}
function levelProgress(xp){const c=levelOf(xp),n=nextLevel(xp);if(!n)return 1;return (xp-c.xp)/(n.xp-c.xp)}
function mastered(id){const s=D.qstats[id];return s&&s.correct>=2&&s.lastCorrect}
function masteredCount(){return Object.keys(D.qstats).filter(mastered).length}
function toReviewCount(){return Object.keys(D.qstats).filter(id=>{const s=D.qstats[id];return s&&s.seen>0&&!mastered(id)}).length}
function catRate(c){const s=D.catstats[c];return s&&s.seen?s.correct/s.seen:0}
function addXP(n){ if(n<=0)return; D.xp+=n;
  const today=new Date().toISOString().slice(0,10);
  if(D.todayDate!==today){ D.todayDate=today; D.todayXP=0; }
  const before=D.todayXP||0; D.todayXP=before+n; const g=D.dailyGoal||20;
  if(before<g && D.todayXP>=g && D.goalCelebrated!==today){ D.goalCelebrated=today; try{confetti(30);sfx('win');}catch(e){} }
}
function recordAnswer(q,ok){
  D.totalAnswered++; if(ok)D.totalCorrect++;
  const s=D.qstats[q.id]||{seen:0,correct:0,lastCorrect:false};
  s.seen++; if(ok)s.correct++; s.lastCorrect=ok;
  // Répétition espacée (Leitner) : prochaine révision selon la réussite.
  s.box = ok ? Math.min((s.box||0)+1,5) : 1;
  s.due = Date.now() + ([0,1,2,4,7,15][s.box]||1)*86400000;
  D.qstats[q.id]=s;
  const cs=D.catstats[q.category]||{seen:0,correct:0}; cs.seen++; if(ok)cs.correct++; D.catstats[q.category]=cs;
  if(ok)addXP(10); checkBadges();
}
function dailyActivity(){
  const today=new Date().toISOString().slice(0,10);
  if(D.lastStudyDate===today){ checkBadges(); return; }
  if(D.lastStudyDate){
    const diff=Math.round((new Date(today)-new Date(D.lastStudyDate))/86400000);
    if(diff===1){ D.streakDays++; }
    else if(diff===2 && (D.freezes||0)>0){ D.freezes--; D.streakDays++; D.usedFreeze=today; } // gel : 1 jour manqué sauvé
    else { D.streakDays=1; }
  } else D.streakDays=1;
  D.lastStudyDate=today; D.longestStreak=Math.max(D.longestStreak,D.streakDays); addXP(25);
  checkBadges();
}
function checkBadges(){for(const b of BADGES){if(!D.badges.includes(b.id)&&b.ok(D)){D.badges.push(b.id);queueToast(b)}}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(cat){return cat?QUESTIONS.filter(q=>q.category===cat):QUESTIONS}
function weightOf(q){const s=D.qstats[q.id];if(!s||!s.seen)return 4;if(mastered(q.id))return 1;if(!s.lastCorrect)return 6;return 2.5}
function weighted(n,cat){let rem=pool(cat).slice(),out=[];
  while(out.length<n&&rem.length){const w=rem.map(weightOf),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,i=0;
    for(let k=0;k<w.length;k++){r-=w[k];if(r<0){i=k;break}}out.push(rem.splice(i,1)[0])}
  return out}
function toReviewList(n){return shuffle(QUESTIONS.filter(q=>{const s=D.qstats[q.id];return s&&s.seen>0&&!mastered(q.id)})).slice(0,n)}
// Répétition espacée : questions dont la date de révision est atteinte
function dueList(){ const now=Date.now(); return QUESTIONS.filter(q=>{const s=D.qstats[q.id];return s&&s.seen>0&&(s.due||0)<=now;}); }
function dueCount(){ return dueList().length; }
function reviewList(n){ const seen=new Set(), out=[];
  for(const q of shuffle(dueList()).concat(shuffle(QUESTIONS.filter(q=>{const s=D.qstats[q.id];return s&&s.seen>0&&!mastered(q.id);})))){
    if(out.length>=n)break; if(!seen.has(q.id)){seen.add(q.id);out.push(q);}
  }
  return out; }
function examSet(){
  // Format officiel : 28 questions de connaissances + 12 mises en situation.
  const nK=28, nS=12;
  const know=shuffle(QUESTIONS.filter(q=>q.type!=='situation'));
  const situ=shuffle(QUESTIONS.filter(q=>q.type==='situation'));
  let out=know.slice(0,nK).concat(situ.slice(0,nS));
  if(out.length<CFG.q){ // complément si la banque manque d'un type
    const used=new Set(out.map(q=>q.id));
    out=out.concat(shuffle(QUESTIONS.filter(q=>!used.has(q.id))).slice(0,CFG.q-out.length));
  }
  return shuffle(out.slice(0,CFG.q));
}
function situPill(q){ return q.type==='situation'
  ? `<span class="pill" style="background:rgba(251,160,41,.15);color:var(--orange)">📘 Mise en situation</span> ` : ''; }
function passThreshold(total){return total===CFG.q?CFG.threshold:Math.ceil(total*CFG.pass/100)}

/* ============================= Sons & toasts ============================= */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function tone(freq,dur,type,vol,when){ const a=ac(); if(!a)return;
  const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.value=freq;
  o.connect(g); g.connect(a.destination); const t0=a.currentTime+(when||0);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.start(t0); o.stop(t0+dur+0.03); }
// Petits effets sonores synthétisés (gamification). Désactivables via Sons.
function sfx(name){ if(!D.sound) return; try{ switch(name){
  case 'tap':    tone(380,0.05,'triangle',0.05); break;
  case 'select': tone(560,0.06,'triangle',0.10); break;
  case 'correct':tone(660,0.10,'sine',0.16,0); tone(880,0.12,'sine',0.16,0.09); tone(1175,0.16,'sine',0.14,0.19); break;
  case 'wrong':  tone(300,0.14,'sine',0.13,0); tone(196,0.20,'sine',0.11,0.11); break;
  case 'finish': [523,659,784].forEach((f,i)=>tone(f,0.14,'sine',0.16,i*0.11)); break;
  case 'win':    [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.17,'sine',0.18,i*0.12)); break;
  case 'badge':  [784,1047,1319].forEach((f,i)=>tone(f,0.13,'triangle',0.16,i*0.09)); break;
  case 'levelup':[440,587,784].forEach((f,i)=>tone(f,0.14,'square',0.09,i*0.10)); break;
} }catch(e){} }
function beep(ok){ sfx(ok?'correct':'wrong'); } // compat
function haptic(){if(navigator.vibrate)navigator.vibrate(10)}
// Lecture audio en français (aide à la prononciation / compréhension)
function speakText(text,lang){ try{ if('speechSynthesis' in window){ window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang=lang||'fr-FR'; u.rate=0.95; window.speechSynthesis.speak(u);} }catch(e){} }
function speak(text){ speakText(text,'fr-FR'); }
function speakQ(id){ const q=QUESTIONS.find(x=>x.id===id); if(!q)return; speak(q.question_fr+'. '+q.answers_fr.join('. ')); }
function speakExpl(id,which){ const q=QUESTIONS.find(x=>x.id===id); if(!q)return;
  speakText(which==='vi'?q.explanation_vi:q.explanation_fr, which==='vi'?'vi-VN':'fr-FR'); }
// Animations (confettis, +XP), respectant prefers-reduced-motion
function prefersReduced(){ try{ return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function confetti(n){ if(prefersReduced())return; n=n||22;
  const colors=['#1a388c','#438fff','#33bd73','#fba029','#fdcc38','#eb4d54'];
  for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='confetti-piece';
    d.style.left=(Math.random()*100)+'vw'; d.style.background=colors[i%colors.length];
    const dur=1.2+Math.random()*1.3; d.style.animation='conffall '+dur+'s linear forwards';
    d.style.animationDelay=(Math.random()*0.25)+'s'; document.body.appendChild(d);
    setTimeout(()=>d.remove(),(dur+0.4)*1000); } }
function floatXP(txt){ if(prefersReduced())return; const d=document.createElement('div');
  d.className='xpfloat'; d.textContent=txt; document.body.appendChild(d); setTimeout(()=>d.remove(),1100); }
let toastQ=[],toasting=false;
function queueToast(b){toastQ.push(b);if(!toasting)nextToast()}
function nextToast(){if(!toastQ.length){toasting=false;return}toasting=true;const b=toastQ.shift();
  document.getElementById('toastIc').textContent=b.em;
  document.getElementById('toastTxt').textContent=b[D.lang]||b.fr;
  const el=document.getElementById('toast');el.classList.add('show');sfx('badge');
  setTimeout(()=>{el.classList.remove('show');setTimeout(nextToast,400)},2400)}

/* ----- Entraînement (plein écran) ----- */
function startTraining(kind,cat,n){
  let qs = kind==='quick'?weighted(n,null) : kind==='cat'?weighted(10,cat) : reviewList(20);
  if(!qs.length){alert(D.lang==='vi'?'Chưa có câu nào để ôn. Hãy luyện tập thêm!':"Rien à revoir pour le moment ! Entraîne-toi d'abord.");return}
  nav(ScreenTraining(qs));
}
function ScreenTraining(qs){
  let i=0,sel=null,revealed=false,correct=0,streak=0,trsh=!!D.showTrad,startT=Date.now();
  const s={
    render(){
      const q=qs[i];
      if(i>=qs.length) return done();
      return `
      <div class="row" style="margin:4px 0 10px"><b>${i+1}/${qs.length}</b><div class="sp"></div><span style="color:var(--green)">✅ ${correct}</span>
        <span class="link" style="margin-left:14px" onclick="S.quit()">✕</span></div>
      <div class="bar" style="margin-bottom:14px"><i style="width:${Math.round(i/qs.length*100)}%"></i></div>
      <div class="card">${situPill(q)}<h3>${q.question_fr}</h3>${trsh?`<p class="muted">${q.question_vi}</p>`:''}</div>
      <div class="row" style="margin:0 2px 8px">
        <button class="link" style="background:none;border:none;font:inherit" onclick="S.tr()">${trsh?tr('hide'):tr('translate')}</button>
        <div class="sp"></div>
        <button class="link" style="background:none;border:none;font:inherit" onclick="speakQ('${q.id}')" aria-label="Écouter la question">🔊 Écouter</button>
      </div>
      <div id="opts">${opts(q)}</div>
      ${revealed?expl(q):''}
      ${revealed
        ? `<button class="btn green" onclick="S.adv()">${i===qs.length-1?tr('finish'):tr('next')}</button>`
        : `<button class="btn" id="val" ${sel===null?'disabled':''} onclick="S.val()">${tr('validate')}</button>`}
      `;
    },
    bind(){window.S=s;},
    pick(k){ if(revealed)return; sel=k; sfx('select'); haptic(); render(); },
    tr(){ trsh=!trsh; D.showTrad=trsh; save(); render(); },
    val(){ if(sel===null)return; revealed=true; const q=qs[i],ok=sel===q.correct_answer;
      if(ok){correct++;streak++;if(streak===5)addXP(15)}else streak=0;
      recordAnswer(q,ok); save(); beep(ok); haptic(); render();
      if(ok){ confetti(18); floatXP('+10 XP'); }
      else {
        const el=document.querySelector('.expl-card'); if(el) el.classList.add('shake');
        if(D.autoSpeakErr) speakExpl(q.id, D.lang==='vi'?'vi':'fr');
      }
    },
    adv(){ sel=null; revealed=false; if(i<qs.length-1){i++;render()}else{i++;sfx('finish');render()} },
    quit(){ back(); }
  };
  function opts(q){return q.answers_fr.map((a,k)=>{
    let cls='opt';
    if(revealed){ if(k===q.correct_answer)cls+=' ok'; else if(k===sel)cls+=' ko'; else cls+=' dim'; }
    else if(sel===k)cls+=' sel';
    return `<div class="${cls}" onclick="S.pick(${k})"><span class="mk"></span><div>${a}${trsh?`<span class="tr">${q.answers_vi[k]}</span>`:''}</div></div>`;
  }).join('')}
  function expl(q){const ok=sel===q.correct_answer; const showVi = trsh || !ok;
    return `<div class="card fade pop expl-card"><b style="color:${ok?'var(--green)':'var(--orange)'}">${ok?'🎉 '+tr('correct'):'💡 '+tr('wrong')}</b>
      <p style="margin:8px 0 0">${q.explanation_fr}</p>
      ${showVi?`<p class="muted" style="margin:6px 0 0">🇻🇳 ${q.explanation_vi}</p>`:''}
      <div class="row" style="margin-top:10px;gap:14px">
        <button class="link" style="background:none;border:none;font:inherit" onclick="speakExpl('${q.id}','fr')" aria-label="Écouter l'explication en français">🔊 FR</button>
        <button class="link" style="background:none;border:none;font:inherit" onclick="speakExpl('${q.id}','vi')" aria-label="Nghe giải thích tiếng Việt">🔊 VN</button>
      </div></div>`}
  function done(){ addXP(20); dailyActivity(); save();
    const pct=Math.round(correct/qs.length*100);
    return `<div style="min-height:70dvh;display:flex;flex-direction:column;justify-content:center;gap:14px" class="center">
      <div style="font-size:64px">${pct>=80?'🌟':'👍'}</div><h2>Séance terminée !</h2>
      <p class="muted">${correct}/${qs.length} bonnes réponses</p><p style="color:var(--green)"><b>+${20} XP</b></p>
      <button class="btn" onclick="back()">${tr('finish')}</button></div>`;}
  return s;
}

/* ----- Examen (plein écran) ----- */
function viewExam(){

  return `<div class="center" style="margin-top:10px"><div style="font-size:54px">🎯</div><h2>Simulation d'examen</h2></div>
    <div class="card">
      <p>📋 ${Math.min(QUESTIONS.length,CFG.q)} questions</p>
      <p>⏱️ ${CFG.mins} minutes</p>
      <p>🎯 Seuil de réussite : ${CFG.pass} %</p>
      <p>🙈 Aucun indice pendant l'épreuve</p>
      <p>🌐 ${D.strict?'Mode strict : traduction désactivée':'Traduction 🇻🇳 à la demande'}</p>
    </div>
    <p class="muted center" style="font-size:12px">Format conforme à l'examen civique officiel (40 q · 45 min · 80 %). Questions pédagogiques, non officielles.</p>
    ${QUESTIONS.length<CFG.q?`<p class="muted center">La banque contient ${QUESTIONS.length} questions ; l'examen en utilisera ${Math.min(QUESTIONS.length,CFG.q)}.</p>`:''}
    ${saved?`<button class="btn orange" onclick="nav(ScreenExam(true))">${tr('resume')}</button>`:''}
    <button class="btn" onclick="nav(ScreenExam(false))">${tr('startExam')}</button>`;
}
function loadExam(){try{return JSON.parse(localStorage.getItem(EKEY)||'null')}catch(e){return null}}
function saveExam(st){try{localStorage.setItem(EKEY,JSON.stringify(st))}catch(e){}}
function clearExam(){localStorage.removeItem(EKEY)}

function ScreenExam(resume){
  let st, qs, timer=null, finished=false, result=null, trsh=!!D.showTrad, gridOpen=false;
  if(resume){ st=loadExam(); qs=st.ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
    if(qs.length!==st.ids.length){clearExam();resume=false} }
  if(!resume){ qs=examSet(); st={ids:qs.map(q=>q.id),ans:qs.map(()=>null),flags:qs.map(()=>false),idx:0,start:Date.now(),dur:CFG.mins*60,strict:D.strict}; saveExam(st); }
  if(!st.flags||st.flags.length!==qs.length) st.flags=qs.map(()=>false);
  const strict=st.strict;
  function remaining(){return Math.max(0,st.dur-Math.floor((Date.now()-st.start)/1000))}
  function fmt(s){return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  const s={
    render(){
      if(finished) return results();
      if(gridOpen) return gridView();
      const q=qs[st.idx], rem=remaining(), answered=st.ans.filter(a=>a!==null).length, flagged=st.flags[st.idx];
      return `
      <div class="card" style="margin-top:4px">
        <div class="row"><b class="mono" style="font-size:20px;color:${rem<300?'var(--red)':'var(--blue-deep)'}">⏱️ ${fmt(rem)}</b>
          <div class="sp"></div><span class="muted">${answered}/${qs.length}</span></div>
        <div class="bar" style="margin-top:8px"><i style="width:${Math.round((st.idx+1)/qs.length*100)}%"></i></div>
      </div>
      <div class="row" style="margin:2px"><span class="muted">Question ${st.idx+1}/${qs.length}</span><div class="sp"></div>
        <button class="link" style="background:none;border:none;font:inherit" onclick="E.flag()" aria-pressed="${flagged}">${flagged?'🚩 Marquée':'🏳️ Marquer à revoir'}</button></div>
      <div class="card">${situPill(q)}<h3>${q.question_fr}</h3>${(trsh&&!strict)?`<p class="muted">${q.question_vi}</p>`:''}</div>
      ${strict?'':`<div class="row" style="margin:0 2px 8px">
        <button class="link" style="background:none;border:none;font:inherit" onclick="E.tr()">${trsh?tr('hide'):tr('translate')}</button>
        <div class="sp"></div>
        <button class="link" style="background:none;border:none;font:inherit" onclick="speakQ('${q.id}')" aria-label="Écouter la question">🔊 Écouter</button>
      </div>`}
      <div role="radiogroup" aria-label="Réponses">
      ${q.answers_fr.map((a,k)=>`<div class="opt ${st.ans[st.idx]===k?'sel':''}" role="radio" tabindex="0" aria-checked="${st.ans[st.idx]===k}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="E.pick(${k})"><span class="mk"></span>
        <div>${a}${(trsh&&!strict)?`<span class="tr">${q.answers_vi[k]}</span>`:''}</div></div>`).join('')}
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" style="width:auto;padding:12px 18px;margin:0" ${st.idx===0?'disabled':''} onclick="E.prev()">‹ ${tr('prev')}</button>
        <div class="sp"></div>
        ${st.idx===qs.length-1
          ? `<button class="btn green" style="width:auto;padding:12px 20px;margin:0" onclick="E.grid()">${tr('finish')}</button>`
          : `<button class="btn" style="width:auto;padding:12px 20px;margin:0" onclick="E.next()">${tr('next')} ›</button>`}
      </div>
      <button class="btn ghost" style="margin-top:14px" onclick="E.grid()">Récapitulatif / Terminer</button>
      `;
    },
    bind(){ window.E=s;
      if(!s._t){ s._t=setInterval(()=>{ if(finished||scr!==s){clearInterval(s._t);s._t=null;return} if(remaining()<=0){s.finish()}else tick() },1000); }
      if(!s._vis){ s._vis=true; document.addEventListener('visibilitychange',vis); } },
    pick(k){ st.ans[st.idx]=k; saveExam(st); sfx('select'); haptic(); render(); },
    tr(){ trsh=!trsh; D.showTrad=trsh; save(); render(); },
    next(){ if(st.idx<qs.length-1)st.idx++; saveExam(st); render(); },
    prev(){ if(st.idx>0)st.idx--; saveExam(st); render(); },
    flag(){ st.flags[st.idx]=!st.flags[st.idx]; saveExam(st); haptic(); render(); },
    grid(){ gridOpen=!gridOpen; render(); },
    gotoFromGrid(i){ if(qs[i])st.idx=i; gridOpen=false; saveExam(st); render(); },
    finish(){ if(finished)return; finished=true; gridOpen=false; if(s._t){clearInterval(s._t);s._t=null}
      let score=0; const per={};
      qs.forEach((q,k)=>{const ok=st.ans[k]===q.correct_answer; if(ok)score++;
        per[q.category]=per[q.category]||[0,0]; per[q.category][1]++; if(ok)per[q.category][0]++;
        // alimente les stats par question + répétition espacée (les ratés reviendront en révision)
        const s2=D.qstats[q.id]||{seen:0,correct:0,lastCorrect:false};
        s2.seen++; if(ok)s2.correct++; s2.lastCorrect=ok;
        s2.box = ok?Math.min((s2.box||0)+1,5):1;
        s2.due = Date.now()+([0,1,2,4,7,15][s2.box]||1)*86400000;
        D.qstats[q.id]=s2;});
      const timeUsed=Math.min(st.dur,Math.floor((Date.now()-st.start)/1000));
      const pct=Math.round(score/qs.length*100);
      result={score,total:qs.length,pct,timeUsed,per,answers:st.ans.slice(),ids:st.ids.slice(),pass:score>=passThreshold(qs.length)};
      lastExamIds=result.ids; lastExamAns=result.answers;
      // enregistrer dans stats
      for(const c in per){const cs=D.catstats[c]||{seen:0,correct:0};cs.seen+=per[c][1];cs.correct+=per[c][0];D.catstats[c]=cs}
      D.totalAnswered+=qs.length; D.totalCorrect+=score; addXP(20);
      D.exams.push({date:Date.now(),score,total:qs.length,pct,pass:result.pass});
      dailyActivity(); checkBadges(); save(); clearExam();
      sfx(result.pass?'win':'wrong'); render(); if(result.pass) confetti(50);
    }
  };
  function gridView(){
    const answered=st.ans.filter(a=>a!==null).length, flagged=st.flags.filter(Boolean).length;
    return `
    <div class="row" style="margin:4px 0 10px"><h2>Récapitulatif</h2><div class="sp"></div>
      <button class="link" style="background:none;border:none;font:inherit" onclick="E.grid()">Fermer</button></div>
    <p class="muted">Répondues : ${answered}/${qs.length} · Marquées 🚩 : ${flagged}</p>
    <p class="muted" style="font-size:12px">Touche un numéro pour y aller. Bleu = répondue, contour orange = marquée.</p>
    <div class="gridwrap" style="margin:12px 0">
      ${qs.map((q,i)=>`<button class="cell ${st.ans[i]!==null?'done':''} ${st.flags[i]?'flag':''} ${i===st.idx?'cur':''}"
        aria-label="Question ${i+1}${st.ans[i]!==null?', répondue':', non répondue'}${st.flags[i]?', marquée':''}" onclick="E.gotoFromGrid(${i})">${i+1}</button>`).join('')}
    </div>
    <button class="btn green" onclick="E.finish()">Terminer l'examen (${answered}/${qs.length} répondues)</button>
    <button class="btn ghost" onclick="E.grid()">Continuer l'examen</button>
    `;
  }
  function tick(){ const el=document.querySelector('.mono'); if(el){const r=remaining();el.textContent='⏱️ '+fmt(r);el.style.color=r<300?'var(--red)':'';} }
  function vis(){ if(document.visibilityState==='visible'&&!finished) render(); }
  function results(){
    const r=result, frac=r.score/r.total;
    const cats=Object.keys(r.per).map(c=>({c,rate:r.per[c][0]/r.per[c][1]})).sort((a,b)=>a.rate-b.rate);
    return `<div class="center" style="margin-top:8px">
      <h2 style="color:${r.pass?'var(--green)':'var(--orange)'}">${r.pass?tr('passed'):tr('failed')}</h2>
      ${ringSVG(r.score,r.total,r.pass)}
    </div>
    <div class="grid3">
      <div class="tile"><div class="v">${fmt(r.timeUsed)}</div><div class="l">${tr('time')}</div></div>
      <div class="tile"><div class="v" style="color:var(--green)">${r.score}</div><div class="l">${tr('good')}</div></div>
      <div class="tile"><div class="v" style="color:var(--red)">${r.total-r.score}</div><div class="l">${tr('bad')}</div></div>
    </div>
    <div class="card"><b>${tr('byCat')}</b>${cats.map(x=>`
      <div class="row" style="margin-top:10px"><span style="width:120px;font-size:13px">${catName(x.c)}</span>
      <div class="bar" style="flex:1"><i style="width:${Math.round(x.rate*100)}%;background:${CATS[x.c].c}"></i></div>
      <b style="width:42px;text-align:right">${Math.round(x.rate*100)}%</b></div>`).join('')}</div>
    <button class="btn" onclick="showCorrection()">${tr('correction')}</button>
    <button class="btn" style="background:#25D366" onclick="shareCardWhatsApp(${r.score},${r.total},${r.pct},${r.pass})">📲 Partager sur WhatsApp</button>
    <button class="btn ghost" onclick="shareResult(${r.score},${r.total},${r.pct})">📤 Autre partage</button>
    ${!r.pass&&cats.length?`<button class="btn ghost" onclick="startTraining('cat','${cats[0].c}')">Séance ciblée : ${catName(cats[0].c)}</button>`:''}
    <button class="btn ghost" onclick="go('home')">Accueil</button>`;
  }
  return s;
}
function ringSVG(score,total,pass){
  const frac=total?score/total:0, R=70, C=2*Math.PI*R, off=C*(1-frac), col=pass?'var(--green)':'var(--orange)';
  return `<svg class="ring" viewBox="0 0 170 170">
    <circle cx="85" cy="85" r="${R}" fill="none" stroke="rgba(120,120,120,.18)" stroke-width="14"/>
    <circle cx="85" cy="85" r="${R}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 85 85)"/>
    <text x="85" y="80" text-anchor="middle" font-size="30" font-weight="800" fill="var(--text)">${score}/${total}</text>
    <text x="85" y="105" text-anchor="middle" font-size="15" fill="var(--muted)">${Math.round(frac*100)} %</text></svg>`;
}

/* ----- Correction (plein écran) ----- */
function ScreenCorrection(ids,answers){
  let wrongOnly=false;
  const qs=ids.map(id=>QUESTIONS.find(q=>q.id===id));
  const s={
    render(){
      const list=qs.map((q,k)=>({q,k})).filter(({q,k})=>!wrongOnly||answers[k]!==q.correct_answer);
      return `<div class="row" style="margin:4px 0 10px"><h2>${tr('correction')}</h2><div class="sp"></div><span class="link" onclick="back()">✕</span></div>
      <div class="seg"><button class="${!wrongOnly?'on':''}" onclick="C.all()">Tout</button><button class="${wrongOnly?'on':''}" onclick="C.wrong()">Erreurs</button></div>
      ${list.map(({q,k})=>{const given=answers[k],ok=given===q.correct_answer;
        return `<div class="card"><div class="row"><span class="muted">Q${k+1}</span><div class="sp"></div>${ok?'✅':'❌'}</div>
          <h3 style="margin:6px 0">${q.question_fr}</h3><p class="muted" style="margin:0 0 8px">${q.question_vi}</p>
          ${q.answers_fr.map((a,j)=>`<div style="padding:4px 0;color:${j===q.correct_answer?'var(--green)':(j===given?'var(--red)':'')}">
            ${j===q.correct_answer?'✓':(j===given?'✗':'•')} ${a}</div>`).join('')}
          <hr style="border:none;border-top:1px solid var(--line);margin:8px 0">
          <p style="margin:0">${q.explanation_fr}</p><p class="muted" style="margin:4px 0 0">🇻🇳 ${q.explanation_vi}</p>
          <div class="row" style="margin-top:8px;gap:14px">
            <button class="link" style="background:none;border:none;font:inherit" onclick="speakExpl('${q.id}','fr')">🔊 FR</button>
            <button class="link" style="background:none;border:none;font:inherit" onclick="speakExpl('${q.id}','vi')">🔊 VN</button>
          </div></div>`}).join('')}`;
    },
    bind(){window.C=s}, all(){wrongOnly=false;render()}, wrong(){wrongOnly=true;render()}
  };
  return s;
}

      <div class="row" style="margin-top:8px"><span>Mon examen le</span><div class="sp"></div>
        <input type="date" value="${D.examDate||''}" onchange="D.examDate=this.value||null;save();render()"></div>
      <p class="muted" style="font-size:12px;margin:8px 0 0">Un compteur « Examen dans X jours » s'affichera sur l'accueil.</p>
    </div>
    <div class="card"><b>Rappel quotidien</b>
      ${toggle('reminderOn','Activer le rappel',D.reminderOn)}
      <div class="row" style="margin-top:4px"><span>Heure</span><div class="sp"></div>
        <select onchange="D.reminderHour=parseInt(this.value,10);save();render()">
          ${[7,8,9,12,17,18,19,20,21].map(h=>`<option value="${h}" ${D.reminderHour===h?'selected':''}>${h}h</option>`).join('')}
        </select></div>
      <p class="muted" style="font-size:12px;margin:8px 0 10px">Un rappel s'affiche à l'ouverture de l'app si tu n'as pas révisé après cette heure. Pour une notification même app fermée, utilise l'app iOS.</p>
      <button class="btn ghost" onclick="enableNotif()">🔔 Autoriser les notifications (optionnel)</button>
    </div>
    <div class="card"><b>Sauvegarde</b>
      <p class="muted" style="font-size:12px;margin:6px 0 10px">Tes données sont stockées uniquement sur cet appareil. Exporte-les pour les conserver ou les transférer.</p>
      <button class="btn ghost" onclick="exportData()">⬇️ Exporter ma progression</button>
      <label class="btn ghost" style="display:block;text-align:center;cursor:pointer">⬆️ Importer une sauvegarde<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label>
    </div>
    <div class="card"><div class="muted" style="font-size:13px">Banque : ${QUESTIONS.length} questions. Données stockées uniquement sur cet appareil.</div></div>
    <button class="btn" style="background:var(--red)" onclick="if(confirm('Réinitialiser XP, badges, séries et statistiques ?')){var kn=D.name,kl=D.lang,kf=D.fontScale,kh=D.highContrast;D=defaults();D.name=kn;D.lang=kl;D.fontScale=kf;D.highContrast=kh;D.onboarded=true;clearExam();save();go('profile')}">${tr('reset')}</button>`;
}}}
function toggle(key,label,val){return `<div class="row" style="margin:6px 0"><b>${label}</b><div class="sp"></div>
  <span class="switch"><input type="checkbox" id="sw_${key}" ${val?'checked':''} onchange="D.${key}=this.checked;save()"><label for="sw_${key}"></label></span></div>`}
function head(t){return `<div class="row" style="margin:4px 0 12px"><span class="link" onclick="back()">‹</span><h2>${t}</h2></div>`}

/* ----- Accessibilité & rappels ----- */
function applyFontScale(){ try{ document.body.style.zoom=String(D.fontScale||1); }catch(e){} }
function setFontScale(v){ D.fontScale=v; save(); applyFontScale(); render(); }
function applyContrast(){ try{ document.documentElement.dataset.contrast = D.highContrast?'high':''; }catch(e){} }
function shareResult(score,total,pct){
  const txt=`J'ai fait ${score}/${total} (${pct} %) à un examen civique blanc sur CIVIC FR ! 🇫🇷✅`;
  try{ if(navigator.share){ navigator.share({title:'CIVIC FR',text:txt}).catch(()=>{}); return; } }catch(e){}
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>alert('Résultat copié ✅'),()=>alert(txt)); return; } }catch(e){}
  alert(txt);
}
// Coins arrondis pour le canvas
function roundRect(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
// Génère une carte image (PNG 1080×1080) du résultat
function buildResultCard(score,total,pct,pass){ return new Promise(res=>{ try{
  const c=document.createElement('canvas'); c.width=1080; c.height=1080; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,1080); g.addColorStop(0,'#1a388c'); g.addColorStop(1,'#438fff');
  x.fillStyle=g; x.fillRect(0,0,1080,1080);
  x.fillStyle='#ffffff'; roundRect(x,90,150,900,800,44); x.fill();
  x.textAlign='center';
  x.fillStyle='#1a388c'; x.font='bold 60px Arial,sans-serif'; x.fillText('CIVIC FR',540,290);
  x.fillStyle='#6b7280'; x.font='34px Arial,sans-serif'; x.fillText('Examen civique blanc',540,345);
  x.fillStyle=pass?'#33bd73':'#fba029'; x.font='bold 190px Arial,sans-serif'; x.fillText(score+'/'+total,540,570);
  x.fillStyle='#14161c'; x.font='bold 84px Arial,sans-serif'; x.fillText(pct+' %',540,680);
  x.fillStyle=pass?'#33bd73':'#fba029'; roundRect(x,330,720,420,96,48); x.fill();
  x.fillStyle='#ffffff'; x.font='bold 46px Arial,sans-serif'; x.fillText(pass?'RÉUSSI':'À RETRAVAILLER',540,784);
  x.fillStyle='#6b7280'; x.font='30px Arial,sans-serif'; x.fillText("Objectif : réussir l'examen civique français",540,890);
  x.fillStyle='#438fff'; x.font='26px Arial,sans-serif'; x.fillText('max21b07.github.io/guide-demarches-france/web',540,930);
  c.toBlob(b=>res(b),'image/png');
 }catch(e){ res(null); } }); }
// Partage d'une carte image vers WhatsApp (ou autre), avec replis
async function shareCardWhatsApp(score,total,pct,pass){
  const blob=await buildResultCard(score,total,pct,pass);
  const text=`Examen civique blanc : ${score}/${total} (${pct} %)${pass?' — RÉUSSI ✅':''}\nEntraîne-toi : https://max21b07.github.io/guide-demarches-france/web/`;
  try{
    if(blob && navigator.canShare){
      const file=new File([blob],'resultat-civic-fr.png',{type:'image/png'});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],text,title:'CIVIC FR'}); return; }
    }
    if(navigator.share){ await navigator.share({text,title:'CIVIC FR'}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  // Repli : télécharger l'image puis ouvrir WhatsApp avec le texte
  try{ if(blob){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='resultat-civic-fr.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); } }catch(e){}
  try{ window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank'); }catch(e){}
}
function studiedToday(){ return D.lastStudyDate===new Date().toISOString().slice(0,10); }
function reminderDue(){ if(!D.reminderOn||studiedToday())return false; return new Date().getHours()>=(D.reminderHour||19); }
function reminderCard(){ if(!reminderDue())return '';
  return `<div class="card" style="border-left:4px solid var(--blue-light)"><b>⏰ Rappel du jour</b>
    <p style="margin:6px 0 0">Tu n'as pas encore révisé aujourd'hui. 5 minutes suffisent pour progresser 💪</p></div>`; }
function daysUntilExam(){ if(!D.examDate)return null;
  const d=new Date(D.examDate+'T00:00:00'); if(isNaN(d))return null;
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.ceil((d-today)/86400000); }
function examCountdownCard(){ const n=daysUntilExam(); if(n===null)return '';
  const txt = n>1?`Examen dans ${n} jours` : n===1?'Examen demain !' : n===0?"Examen aujourd'hui ! 🍀" : 'Date d\'examen passée';
  return `<div class="card" style="border-left:4px solid var(--green)"><b>📅 ${txt}</b>${n>0?`<p class="muted" style="margin:6px 0 0">Entraîne-toi un peu chaque jour pour être prête 💪</p>`:''}</div>`; }
function dailyGoalCard(){
  const g=D.dailyGoal||20, x=Math.min(D.todayXP||0,g), frac=g?x/g:0, done=(D.todayXP||0)>=g;
  const R=26,C=2*Math.PI*R,off=C*(1-frac);
  return `<div class="card"><div class="row">
    <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
      <circle cx="36" cy="36" r="${R}" fill="none" stroke="rgba(120,120,120,.18)" stroke-width="8"/>
      <circle cx="36" cy="36" r="${R}" fill="none" stroke="${done?'var(--green)':'var(--orange)'}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 36 36)" style="transition:stroke-dashoffset .7s ease-out"/>
      <text x="36" y="41" text-anchor="middle" font-size="17" font-weight="800" fill="var(--text)">${D.todayXP||0}</text></svg>
    <div style="flex:1;margin-left:14px">
      <b>Objectif du jour ${done?'✅':''}</b>
      <div class="muted" style="font-size:13px;margin-top:2px">${D.todayXP||0}/${g} XP ${done?"— bravo, objectif atteint !":""}</div>
      <div style="font-size:13px;margin-top:4px">🔥 ${D.streakDays} j · ❄️ ${D.freezes||0} gel${(D.freezes||0)>1?'s':''} de série</div>
    </div></div></div>`;
}
function enableNotif(){ try{ if('Notification' in window){
      Notification.requestPermission().then(pp=>{ alert(pp==='granted'?'Notifications autorisées ✅':'Notifications non autorisées.'); });
    } else { alert('Notifications non disponibles sur ce navigateur.'); } }catch(e){} }
function maybeNotify(){ try{
    if(D.reminderOn && reminderDue() && 'Notification' in window && Notification.permission==='granted'){
      const today=new Date().toISOString().slice(0,10);
      if(D.lastNudge!==today){ D.lastNudge=today; save(); new Notification('CIVIC FR',{body:'Il est temps de réviser ! 5 minutes suffisent.'}); }
    } }catch(e){} }

/* ============================= Démarrage ============================= */
applyFontScale();
applyContrast();
render();
maybeNotify();
// Son discret au toucher des boutons et éléments interactifs (gamification)
document.addEventListener('click',function(ev){ if(!D.sound)return;
  const t=ev.target.closest&&ev.target.closest('button,.btn,.access,.tabbar button,.link,select');
  if(t) sfx('tap');
},true);
// Récupération depuis IndexedDB si le localStorage a été effacé
try{ if(!localStorage.getItem(KEY)){ idbLoad(function(d){ if(d&&d.onboarded){ D=Object.assign(defaults(),d); applyFontScale(); applyContrast(); save(); render(); } }); } }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
